<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #172554; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #64748B; }
      .ent-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #FFFFFF; }
      .ent-attr { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #1E293B; }
      .ent-type { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #64748B; }
      .pk { font-weight: bold; fill: #DC2626; }
      .fk { font-weight: bold; fill: #2563EB; }
      .box-ent { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8; }
      .rel-line { stroke: #64748B; stroke-width: 2; stroke-dasharray: 6, 4; fill: none; }
      .rel-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #1E3A8A; background: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="880" fill="#F8FAFC" rx="16" />

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" class="title">ENTITY RELATIONSHIP DIAGRAM (ERD KONSEPTUAL)</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Skema Relasi Data POS Warung Klontong Haji Lubis</text>

  <!-- 1. ENTITY: USERS (Top Left) -->
  <g transform="translate(60, 110)">
    <rect width="250" height="210" class="box-ent" />
    <path d="M 0,8 Q 0,0 8,0 L 242,0 Q 250,0 250,8 L 250,34 L 0,34 Z" fill="#172554" />
    <text x="125" y="23" text-anchor="middle" class="ent-header">USERS (Pengguna)</text>
    <text x="16" y="55" class="ent-attr"><tspan class="pk">PK </tspan>id : string</text>
    <text x="16" y="77" class="ent-attr">username : string</text>
    <text x="16" y="99" class="ent-attr">name : string</text>
    <text x="16" y="121" class="ent-attr">role : enum (Admin|Kasir)</text>
    <text x="16" y="143" class="ent-attr">email : string</text>
    <text x="16" y="165" class="ent-attr">phone : string</text>
    <text x="16" y="187" class="ent-attr">status : string</text>
  </g>

  <!-- 2. ENTITY: CATEGORIES (Top Middle) -->
  <g transform="translate(380, 110)">
    <rect width="200" height="110" class="box-ent" />
    <path d="M 0,8 Q 0,0 8,0 L 192,0 Q 200,0 200,8 L 200,34 L 0,34 Z" fill="#2563EB" />
    <text x="100" y="23" text-anchor="middle" class="ent-header">CATEGORIES</text>
    <text x="16" y="58" class="ent-attr"><tspan class="pk">PK </tspan>name : string</text>
    <text x="16" y="85" class="ent-attr">description : string</text>
  </g>

  <!-- 3. ENTITY: PRODUCTS (Top Right) -->
  <g transform="translate(650, 110)">
    <rect width="260" height="260" class="box-ent" />
    <path d="M 0,8 Q 0,0 8,0 L 252,0 Q 260,0 260,8 L 260,34 L 0,34 Z" fill="#1E3A8A" />
    <text x="130" y="23" text-anchor="middle" class="ent-header">PRODUCTS (Katalog)</text>
    <text x="16" y="55" class="ent-attr"><tspan class="pk">PK </tspan>id : string</text>
    <text x="16" y="77" class="ent-attr">code : string</text>
    <text x="16" y="99" class="ent-attr">barcode : string (EAN-13)</text>
    <text x="16" y="121" class="ent-attr">name : string</text>
    <text x="16" y="143" class="ent-attr"><tspan class="fk">FK </tspan>category : string</text>
    <text x="16" y="165" class="ent-attr">costPrice : integer (IDR)</text>
    <text x="16" y="187" class="ent-attr">sellingPrice : integer (IDR)</text>
    <text x="16" y="209" class="ent-attr">stock : integer</text>
    <text x="16" y="231" class="ent-attr">minStock : integer</text>
    <text x="16" y="251" class="ent-attr">unit : string</text>
  </g>

  <!-- 4. ENTITY: STOCK_MUTATIONS (Middle Right) -->
  <g transform="translate(950, 110)">
    <rect width="200" height="210" class="box-ent" />
    <path d="M 0,8 Q 0,0 8,0 L 192,0 Q 200,0 200,8 L 200,34 L 0,34 Z" fill="#0D9488" />
    <text x="100" y="23" text-anchor="middle" class="ent-header">STOCK_MUTATIONS</text>
    <text x="14" y="55" class="ent-attr"><tspan class="pk">PK </tspan>id : string</text>
    <text x="14" y="77" class="ent-attr">time : datetime</text>
    <text x="14" y="99" class="ent-attr"><tspan class="fk">FK </tspan>productId : string</text>
    <text x="14" y="121" class="ent-attr">type : enum</text>
    <text x="14" y="143" class="ent-attr">qty : integer (+/-)</text>
    <text x="14" y="165" class="ent-attr">finalStock : integer</text>
    <text x="14" y="187" class="ent-attr">actor : string</text>
    <text x="14" y="205" class="ent-attr">notes : string</text>
  </g>

  <!-- 5. ENTITY: TRANSACTIONS (Bottom Middle) -->
  <g transform="translate(380, 480)">
    <rect width="260" height="250" class="box-ent" />
    <path d="M 0,8 Q 0,0 8,0 L 252,0 Q 260,0 260,8 L 260,34 L 0,34 Z" fill="#059669" />
    <text x="130" y="23" text-anchor="middle" class="ent-header">TRANSACTIONS (Penjualan)</text>
    <text x="16" y="55" class="ent-attr"><tspan class="pk">PK </tspan>id : string (TRX-...)</text>
    <text x="16" y="77" class="ent-attr">time : datetime</text>
    <text x="16" y="99" class="ent-attr">customer : string</text>
    <text x="16" y="121" class="ent-attr">cashier : string</text>
    <text x="16" y="143" class="ent-attr">total : integer (IDR)</text>
    <text x="16" y="165" class="ent-attr">cash : integer (IDR)</text>
    <text x="16" y="187" class="ent-attr">change : integer (IDR)</text>
    <text x="16" y="209" class="ent-attr">paymentMethod : string</text>
    <text x="16" y="231" class="ent-attr">status : enum (Selesai|Batal)</text>
  </g>

  <!-- 6. ENTITY: TRANSACTION_ITEMS (Bottom Right) -->
  <g transform="translate(720, 480)">
    <rect width="240" height="200" class="box-ent" />
    <path d="M 0,8 Q 0,0 8,0 L 232,0 Q 240,0 240,8 L 240,34 L 0,34 Z" fill="#D97706" />
    <text x="120" y="23" text-anchor="middle" class="ent-header">TRANSACTION_ITEMS</text>
    <text x="16" y="55" class="ent-attr"><tspan class="pk">PK </tspan>id : string</text>
    <text x="16" y="77" class="ent-attr"><tspan class="fk">FK </tspan>transactionId : string</text>
    <text x="16" y="99" class="ent-attr"><tspan class="fk">FK </tspan>productId : string</text>
    <text x="16" y="121" class="ent-attr">qty : integer</text>
    <text x="16" y="143" class="ent-attr">costPrice : integer</text>
    <text x="16" y="165" class="ent-attr">price : integer</text>
    <text x="16" y="187" class="ent-attr">subtotal : integer</text>
  </g>

  <!-- 7. ENTITY: WHATSAPP_LOGS (Bottom Left) -->
  <g transform="translate(60, 480)">
    <rect width="250" height="210" class="box-ent" />
    <path d="M 0,8 Q 0,0 8,0 L 242,0 Q 250,0 250,8 L 250,34 L 0,34 Z" fill="#15803D" />
    <text x="125" y="23" text-anchor="middle" class="ent-header">WHATSAPP_LOGS</text>
    <text x="16" y="55" class="ent-attr"><tspan class="pk">PK </tspan>id : string (WA-...)</text>
    <text x="16" y="77" class="ent-attr">time : datetime</text>
    <text x="16" y="99" class="ent-attr">type : enum (Struk|Alert|Rekap)</text>
    <text x="16" y="121" class="ent-attr">recipientName : string</text>
    <text x="16" y="143" class="ent-attr">recipientPhone : string</text>
    <text x="16" y="165" class="ent-attr">status : enum (Terkirim|Pending)</text>
    <text x="16" y="187" class="ent-attr">summary : string</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- Categories -> Products (1 to N) -->
  <line x1="580" y1="160" x2="650" y2="160" class="rel-line" />
  <circle cx="585" cy="160" r="3" fill="#64748B" />

  <!-- Products -> Stock Mutations (1 to N) -->
  <line x1="910" y1="210" x2="950" y2="210" class="rel-line" />
  <circle cx="915" cy="210" r="3" fill="#64748B" />

  <!-- Transactions -> Transaction Items (1 to N) -->
  <line x1="640" y1="580" x2="720" y2="580" class="rel-line" />
  <circle cx="645" cy="580" r="3" fill="#64748B" />

  <!-- Products -> Transaction Items (1 to N) -->
  <line x1="780" y1="370" x2="780" y2="480" class="rel-line" />
  <circle cx="780" cy="375" r="3" fill="#64748B" />

  <!-- Transactions -> WhatsApp Logs (1 to N) -->
  <line x1="380" y1="580" x2="310" y2="580" class="rel-line" />
  <circle cx="375" cy="580" r="3" fill="#64748B" />

  <!-- Users -> Transactions (1 to N) -->
  <line x1="185" y1="320" x2="185" y2="410" class="rel-line" />
  <line x1="185" y1="410" x2="450" y2="410" class="rel-line" />
  <line x1="450" y1="410" x2="450" y2="480" class="rel-line" />
  <circle cx="185" cy="325" r="3" fill="#64748B" />
</svg>
